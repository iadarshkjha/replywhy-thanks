<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6f4">
  <meta name="description" content="A note of thanks from ReplyWhy.">
  <title>Thank You — ReplyWhy</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f6f4;
      --ink: #171d49;
      --muted: #566078;
      --lavender: #8581f6;
      --blue: #a7c7fa;
      --peach: #f5d7c8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      overflow-x: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .page {
      position: relative;
      isolation: isolate;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(34px, 6vh, 76px) 24px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(255,255,255,.98) 0%, rgba(255,255,255,.68) 34%, transparent 69%),
        linear-gradient(135deg, #fbf7f2 0%, #f8f7f8 52%, #f4f3fb 100%);
    }
    .wash { position:absolute; z-index:-2; pointer-events:none; filter: blur(1px); }
    .wash-a {
      width: 48vw; height: 68vw; max-height: 790px; max-width: 700px;
      left: -24vw; top: -24vw; border-radius: 48%;
      background: radial-gradient(ellipse at 58% 58%, rgba(247,210,190,.7), rgba(250,231,219,.28) 48%, transparent 72%);
      transform: rotate(-28deg);
    }
    .wash-b {
      width: 55vw; height: 62vw; max-height: 760px; max-width: 820px;
      right: -22vw; top: -25vw; border-radius: 48%;
      background: radial-gradient(ellipse at 48% 52%, rgba(195,190,255,.62), rgba(223,221,255,.3) 48%, transparent 72%);
      transform: rotate(30deg);
    }
    .wash-c {
      width: 68vw; height: 42vw; max-height: 520px;
      left: -14vw; bottom: -22vw; border-radius: 50%;
      background: radial-gradient(ellipse at 50% 45%, rgba(115,127,228,.78), rgba(195,195,255,.32) 48%, transparent 73%);
      transform: rotate(18deg);
    }
    .wash-d {
      width: 62vw; height: 40vw; max-height: 470px;
      right: -17vw; bottom: -23vw; border-radius: 50%;
      background: radial-gradient(ellipse at 50% 45%, rgba(162,202,250,.72), rgba(244,211,202,.32) 52%, transparent 74%);
      transform: rotate(-20deg);
    }
    .contour {
      position: absolute; z-index: -1; pointer-events: none;
      width: 125%; height: 74%; left: -12%; top: 18%;
      opacity: .76;
    }
    .grain {
      position:absolute; inset:0; z-index:-1; pointer-events:none; opacity:.13;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
      mix-blend-mode:multiply;
    }
    main {
      width: min(100%, 930px);
      text-align: center;
      display: flex;
      align-items: center;
      flex-direction: column;
      padding: 20px 0;
    }
    .brand {
      display: block;
      width: 250px;
      height: 50px;
      object-fit: contain;
      margin: 0 auto clamp(62px, 9vh, 104px);
    }
    .eyebrow {
      margin: 0 0 16px;
      color: #7e84a8;
      text-transform: uppercase;
      letter-spacing: .27em;
      font-size: 11px;
      font-weight: 650;
    }
    h1 {
      margin: 0;
      color: #171d49;
      font-family: "Bodoni 72", "Didot", "Iowan Old Style", "Times New Roman", serif;
      font-size: clamp(64px, 10vw, 124px);
      font-weight: 500;
      letter-spacing: -.065em;
      line-height: .98;
    }
    .subhead {
      margin: 12px 0 0;
      color: #46516d;
      font-family: "Bodoni 72", "Didot", "Iowan Old Style", "Times New Roman", serif;
      font-size: clamp(28px, 4.4vw, 53px);
      font-weight: 400;
      letter-spacing: -.045em;
      line-height: 1.12;
    }
    .rule {
      width: 72px; height: 2px; margin: 38px auto 28px;
      background: linear-gradient(90deg, #c9c4ff, #8d88f6, #c9c4ff);
    }
    .message {
      max-width: 670px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(15px, 1.7vw, 20px);
      font-weight: 400;
      line-height: 1.8;
      letter-spacing: -.015em;
    }
    .signoff {
      margin: 30px 0 0;
      color: #858cb2;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .34em;
      text-transform: uppercase;
    }
    footer {
      margin-top: clamp(42px, 7vh, 72px);
      color: #8a8da4;
      font-size: 12px;
      letter-spacing: .03em;
    }
    footer a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(138,141,164,.4); padding-bottom: 3px; }
    footer a:hover { color: var(--ink); }
    @media (max-width: 600px) {
      .page { padding: 36px 22px; min-height: 100svh; }
      .brand { width: 210px; height: 42px; margin-bottom: 66px; }
      .eyebrow { font-size: 9px; letter-spacing: .2em; }
      h1 { font-size: clamp(58px, 17vw, 86px); }
      .subhead { max-width: 430px; font-size: clamp(27px, 7.5vw, 38px); }
      .rule { margin: 30px auto 22px; }
      .message { font-size: 15px; line-height: 1.75; max-width: 410px; }
      .signoff { margin-top: 26px; font-size: 10px; letter-spacing: .25em; }
      .contour { width: 170%; left: -35%; top: 24%; height: 65%; }
      .wash-a { width: 90vw; height: 100vw; left: -52vw; top: -20vw; }
      .wash-b { width: 100vw; height: 100vw; right: -54vw; top: -22vw; }
      .wash-c { width: 110vw; height: 80vw; left: -55vw; bottom: -28vw; }
      .wash-d { width: 110vw; height: 80vw; right: -50vw; bottom: -28vw; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .brand, .eyebrow, h1, .subhead, .rule, .message, .signoff, footer {
        animation: rise-in .8s both;
      }
      .eyebrow { animation-delay: .08s; }
      h1 { animation-delay: .14s; }
      .subhead { animation-delay: .2s; }
      .rule { animation-delay: .25s; }
      .message { animation-delay: .3s; }
      .signoff, footer { animation-delay: .36s; }
      @keyframes rise-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="wash wash-a"></div><div class="wash wash-b"></div>
    <div class="wash wash-c"></div><div class="wash wash-d"></div>
    <svg class="contour" viewBox="0 0 1600 760" preserveAspectRatio="none" aria-hidden="true">
      <path d="M-80 150 C 220 145, 350 400, 620 500 S 1110 530, 1680 80" fill="none" stroke="#9694f2" stroke-width="1.2"/>
      <path d="M-80 250 C 230 210, 410 490, 680 565 S 1210 540, 1680 360" fill="none" stroke="#c4c4fb" stroke-width="1.1" stroke-dasharray="7 6"/>
      <path d="M-80 420 C 170 430, 310 670, 720 690 S 1260 610, 1680 530" fill="none" stroke="#a5bdf5" stroke-width="1.1"/>
    </svg>
    <div class="grain"></div>
    <main>
      <img class="brand" src="/logo.png" alt="ReplyWhy" width="250" height="50">
      <p class="eyebrow">A note of gratitude</p>
      <h1>Thank You</h1>
      <p class="subhead">for being part of our journey.</p>
      <div class="rule" aria-hidden="true"></div>
      <p class="message">
        ReplyWhy is taking a pause while we focus on what comes next.<br>
        Thank you for your support, feedback, and trust.
      </p>
      <p class="signoff">With gratitude, ReplyWhy</p>
      <footer><a href="https://adarshkjha.com">A little more about us</a></footer>
    </main>
  </div>
</body>
</html>
